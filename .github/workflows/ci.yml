name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Start mock server
        run: |
          nohup python -m uvicorn mock_server.app:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          sleep 5
      - name: Run Robot tests
        run: |
          robot --outputdir reports/robot robot_tests
      - name: Run pytest
        run: |
          pytest -q mock_server/tests
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run k6 load tests
        run: |
          k6 run load_tests/scenarios/happy_path.js || true
          k6 run load_tests/scenarios/error_scenarios.js || true
          k6 run load_tests/scenarios/validation.js || true
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            server.log
